[package]
name = "rust-explorer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
winrust-common = { path = "../../common" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }
windows-core = "0.62"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_Graphics_Dwm", "Win32_Graphics_GdiPlus", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["util", "ppmd", "bzip2", "deflate"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# the tests make a real .7z to unpack (the exe itself only unpacks)
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["util", "compress"] }
