[package]
name = "rust-settings"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
winrust-common = { path = "../../common" }
windows-sys = { version = "0.61.2", features = ["Win32_Devices_Bluetooth", "Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_NetworkManagement_Rras", "Win32_Networking_WinInet", "Win32_Security_ExtensibleAuthenticationProtocol", "Win32_UI_Shell", "Win32_UI_ColorSystem", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# COM only for the volume (Core Audio), as photoview uses it for WIC
windows = { version = "0.62", features = ["Win32_Foundation", "Devices_Radios", "Foundation_Collections", "Win32_Networking_NetworkListManager", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_UpdateAgent", "Win32_System_Ole", "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

windows-core = "0.62" # the `interface` macro of audio.rs refers to this crate by name

[build-dependencies]
embed-resource = "3"
